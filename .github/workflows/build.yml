name: Otomatik Release ve EXE Derleme

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Kodları İndir
        uses: actions/checkout@v4

      - name: .NET Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tek Dosya EXE Olarak Yayınla
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: GitHub Release Oluştur ve EXE Ekle
        uses: softprops/action-gh-release@v2
        with:
          files: ./publish/DiskExplorer.exe
          generate_release_notes: true