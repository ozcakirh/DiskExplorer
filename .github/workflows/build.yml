name: Otomatik Release ve EXE Derleme

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Kodları İndir
        uses: actions/checkout@v4

      - name: .NET ve MSBuild Kurulumu
        uses: microsoft/setup-msbuild@v2

      - name: .NET SDK Kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Projeyi Yayınla (Publish)
        run: dotnet publish DiskExplorer.csproj -c Release -o ./publish

      - name: Çıktıyı ZIP Olarak Paketle
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath ./DiskExplorer-Win64.zip

      - name: GitHub Release Oluştur ve ZIP Ekle
        uses: softprops/action-gh-release@v2
        with:
          files: ./DiskExplorer-Win64.zip
          generate_release_notes: true